name: Build PonWrt firmware

run-name: ${{ inputs.model || 'xg-040g-tf' }} PonWrt · ${{ github.event_name }}

on:
  schedule:
    # 02:00 Asia/Shanghai (18:00 UTC), once per day.
    - cron: "0 18 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-xg-040g-tf.yml"
      - "configs/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model profile under configs/<model>.build.env"
        required: true
        default: "xg-040g-tf"
        type: string
      force_build:
        description: "Build even when the configured PonWrt commit has not changed"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ponwrt-${{ inputs.model || 'xg-040g-tf' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  check-upstream:
    name: Check PonWrt upstream
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      ponwrt_repo: ${{ steps.resolve.outputs.ponwrt_repo }}
      ponwrt_ref: ${{ steps.resolve.outputs.ponwrt_ref }}
      extra_packages: ${{ steps.resolve.outputs.extra_packages }}
      exclude_kmods: ${{ steps.resolve.outputs.exclude_kmods }}
      include_all_kmods: ${{ steps.resolve.outputs.include_all_kmods }}
      include_all_packages: ${{ steps.resolve.outputs.include_all_packages }}
      use_ccache: ${{ steps.resolve.outputs.use_ccache }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      release_prefix: ${{ steps.resolve.outputs.release_prefix }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      source_commit_short: ${{ steps.resolve.outputs.source_commit_short }}
      config_hash: ${{ steps.resolve.outputs.config_hash }}
      feed_hash: ${{ steps.resolve.outputs.feed_hash }}
      feed_revisions: ${{ steps.resolve.outputs.feed_revisions }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      model_id: ${{ steps.resolve.outputs.model_id }}
      model_name_en: ${{ steps.resolve.outputs.model_name_en }}
      model_name_zh: ${{ steps.resolve.outputs.model_name_zh }}
      target_config_symbol: ${{ steps.resolve.outputs.target_config_symbol }}
      target_subdir: ${{ steps.resolve.outputs.target_subdir }}
      artifact_prefix: ${{ steps.resolve.outputs.artifact_prefix }}
      required_packages: ${{ steps.resolve.outputs.required_packages }}
      release_target_commit: ${{ steps.resolve.outputs.release_target_commit }}
      release_target_reason: ${{ steps.resolve.outputs.release_target_reason }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_BEFORE: ${{ github.event.before || '' }}
      MODEL_INPUT: ${{ inputs.model || 'xg-040g-tf' }}
      FORCE_BUILD: ${{ inputs.force_build || false }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve configured source and change status
        id: resolve
        run: |
          set -euo pipefail
          model="$MODEL_INPUT"
          [[ "$model" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || {
            echo "::error::Invalid model name: $model"
            exit 1
          }
          config="$GITHUB_WORKSPACE/configs/$model.build.env"
          model_config="$GITHUB_WORKSPACE/configs/$model.config"
          [ -f "$config" ] || {
            echo "::error::Missing model build configuration: $config"
            exit 1
          }
          [ -f "$model_config" ] || {
            echo "::error::Missing model OpenWrt configuration: $model_config"
            exit 1
          }
          # shellcheck disable=SC1090
          source "$config"

          : "${MODEL_ID:?MODEL_ID is required}"
          : "${MODEL_NAME_EN:?MODEL_NAME_EN is required}"
          : "${MODEL_NAME_ZH:?MODEL_NAME_ZH is required}"
          : "${TARGET_CONFIG_SYMBOL:?TARGET_CONFIG_SYMBOL is required}"
          : "${TARGET_SUBDIR:?TARGET_SUBDIR is required}"
          : "${ARTIFACT_PREFIX:?ARTIFACT_PREFIX is required}"
          : "${REQUIRED_PACKAGES:?REQUIRED_PACKAGES is required}"
          [ "$MODEL_ID" = "$model" ] || {
            echo "::error::MODEL_ID ($MODEL_ID) must match selected model ($model)"
            exit 1
          }
          release_target_commit="$GITHUB_SHA"
          release_target_reason="current workflow commit"
          if [ "$EVENT_NAME" = "push" ] &&
             [[ "$EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] &&
             [[ "$EVENT_BEFORE" != "$GITHUB_SHA" ]]; then
            workflow_changes="$(
              git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- .github/workflows
            )"
            if [ -n "$workflow_changes" ]; then
              # GitHub does not allow the default GITHUB_TOKEN to create a
              # release whose target commit changes a workflow file. Point
              # the tag at the push parent while keeping the actual build
              # commit in the manifest and release notes.
              release_target_commit="$EVENT_BEFORE"
              release_target_reason="push parent; workflow files changed"
            fi
          fi
          : "${PONWRT_REPO:?PONWRT_REPO is required}"
          : "${PONWRT_REF:?PONWRT_REF is required}"
          : "${INCLUDE_ALL_KMODS:?INCLUDE_ALL_KMODS is required}"
          : "${INCLUDE_ALL_PACKAGES:?INCLUDE_ALL_PACKAGES is required}"
          : "${USE_CCACHE:?USE_CCACHE is required}"
          : "${PUBLISH_RELEASE:?PUBLISH_RELEASE is required}"
          : "${RELEASE_PREFIX:?RELEASE_PREFIX is required}"
          [ "${#PONWRT_FEEDS[@]}" -gt 0 ] || {
            echo "::error::PONWRT_FEEDS must contain at least one feed"
            exit 1
          }

          set -f
          for package in $EXCLUDE_KMODS; do
            [[ "$package" =~ ^kmod-[A-Za-z0-9_.-]+$ ]] || {
              echo "::error::Invalid EXCLUDE_KMODS entry: $package"
              exit 1
            }
          done
          set +f

          config_hash="$(
            printf '%s\n' \
              "$(sha256sum "$config" | awk '{print $1}')" \
              "$(sha256sum "$model_config" | awk '{print $1}')" \
              | sha256sum | cut -c1-12
          )"

          resolve_ref() {
            if [[ "$PONWRT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf '%s\n' "${PONWRT_REF,,}"
              return
            fi

            refs="$(git ls-remote "$PONWRT_REPO" \
              "refs/heads/$PONWRT_REF" \
              "refs/tags/$PONWRT_REF" \
              "refs/tags/$PONWRT_REF^{}")"
            [ -n "$refs" ] || return 1
            printf '%s\n' "$refs" | awk '
              $2 ~ /\^\{\}$/ { print $1; found = 1; exit }
              { candidate = $1 }
              END {
                if (!found && candidate != "") print candidate
              }
            '
          }

          source_commit=""
          for attempt in 1 2 3; do
            if source_commit="$(resolve_ref)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to resolve $PONWRT_REPO at $PONWRT_REF"
              exit 1
            fi
            echo "::warning::Upstream check failed (attempt $attempt/3); retrying"
            sleep $((attempt * 10))
          done
          [ -n "$source_commit" ] || {
            echo "::error::Resolved upstream commit is empty"
            exit 1
          }

          feed_revisions=""
          for feed_spec in "${PONWRT_FEEDS[@]}"; do
            feed_name="${feed_spec%%=*}"
            feed_repo="${feed_spec#*=}"
            [ -n "$feed_name" ] && [ -n "$feed_repo" ] || {
              echo "::error::Invalid PONWRT_FEEDS entry: $feed_spec"
              exit 1
            }

            feed_commit=""
            for attempt in 1 2 3; do
              if feed_commit="$(git ls-remote "$feed_repo" HEAD | awk 'NR == 1 { print $1 }')"; then
                [ -n "$feed_commit" ] && break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to resolve feed $feed_name at $feed_repo"
                exit 1
              fi
              echo "::warning::Feed check failed for $feed_name (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
            done
            feed_revisions+="${feed_name}=${feed_commit}"$'\n'
          done
          feed_hash="$(printf '%s' "$feed_revisions" | sha256sum | cut -c1-12)"

          last_source_commit=""
          last_feed_hash=""
          last_config_hash=""
          last_model_id=""
          state_file="$GITHUB_WORKSPACE/ci/last-built-ponwrt-state-$MODEL_ID.env"
          legacy_state_file="$GITHUB_WORKSPACE/ci/last-built-ponwrt-state.env"
          if [ -s "$state_file" ]; then
            while IFS='=' read -r state_key state_value; do
              case "$state_key" in
                source_commit) last_source_commit="$state_value" ;;
                feed_hash) last_feed_hash="$state_value" ;;
                config_hash) last_config_hash="$state_value" ;;
                model_id) last_model_id="$state_value" ;;
              esac
            done < "$state_file"
          elif [ -s "$legacy_state_file" ]; then
            # Read the pre-multi-model state file during the one-time migration.
            # Only associate it with this model when its build fingerprint
            # matches; otherwise another model must not inherit its state.
            while IFS='=' read -r state_key state_value; do
              case "$state_key" in
                source_commit) last_source_commit="$state_value" ;;
                feed_hash) last_feed_hash="$state_value" ;;
                config_hash) last_config_hash="$state_value" ;;
              esac
            done < "$legacy_state_file"
            if [ "$last_config_hash" = "$config_hash" ]; then
              last_model_id="$MODEL_ID"
            fi
          elif [ -s "$GITHUB_WORKSPACE/ci/last-built-ponwrt-commit.txt" ]; then
            last_source_commit="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/ci/last-built-ponwrt-commit.txt")"
          fi
          state_changed=false
          if [ "$MODEL_ID" != "$last_model_id" ] ||
             [ "$source_commit" != "$last_source_commit" ] ||
             [ "$feed_hash" != "$last_feed_hash" ] ||
             [ "$config_hash" != "$last_config_hash" ]; then
            state_changed=true
          fi

          should_build=false
          case "$EVENT_NAME" in
            push)
              if [ "$state_changed" = "true" ]; then
                should_build=true
              fi
              ;;
            workflow_dispatch)
              if [ "$FORCE_BUILD" = "true" ] || [ "$state_changed" = "true" ]; then
                should_build=true
              fi
              ;;
            schedule)
              if [ "$state_changed" = "true" ]; then
                should_build=true
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          {
            echo "should_build=$should_build"
            echo "model_id=$MODEL_ID"
            echo "model_name_en=$MODEL_NAME_EN"
            echo "model_name_zh=$MODEL_NAME_ZH"
            echo "target_config_symbol=$TARGET_CONFIG_SYMBOL"
            echo "target_subdir=$TARGET_SUBDIR"
            echo "artifact_prefix=$ARTIFACT_PREFIX"
            echo "required_packages=$REQUIRED_PACKAGES"
            echo "release_target_commit=$release_target_commit"
            echo "release_target_reason=$release_target_reason"
            echo "ponwrt_repo=$PONWRT_REPO"
            echo "ponwrt_ref=$PONWRT_REF"
            echo "extra_packages=$EXTRA_PACKAGES"
            echo "exclude_kmods=$EXCLUDE_KMODS"
            echo "include_all_kmods=$INCLUDE_ALL_KMODS"
            echo "publish_release=$PUBLISH_RELEASE"
            echo "release_prefix=$RELEASE_PREFIX"
            echo "source_commit=$source_commit"
            echo "source_commit_short=${source_commit:0:12}"
            echo "config_hash=$config_hash"
            echo "feed_hash=$feed_hash"
            echo "include_all_packages=$INCLUDE_ALL_PACKAGES"
            echo "use_ccache=$USE_CCACHE"
            echo "release_tag=${RELEASE_PREFIX}-${source_commit:0:12}-${config_hash}-${feed_hash}"
            echo "feed_revisions<<EOF"
            printf '%s' "$feed_revisions"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream check"
            echo "- Model / 型号: \`$MODEL_NAME_ZH / $MODEL_NAME_EN\` (\`$MODEL_ID\`)"
            echo "- Source: \`$PONWRT_REPO\`"
            echo "- Ref: \`$PONWRT_REF\`"
            echo "- Resolved commit: \`$source_commit\`"
            echo "- Previously built source: \`${last_source_commit:-none}\`"
            echo "- Previously built model: \`${last_model_id:-none}\`"
            echo "- Previously built feed hash: \`${last_feed_hash:-none}\`"
            echo "- Previous configuration fingerprint: \`${last_config_hash:-none}\`"
            echo "- Build required: \`$should_build\`"
            echo "- Release target commit: \`$release_target_commit\` ($release_target_reason)"
            echo "- Configuration fingerprint: \`$config_hash\`"
            echo "- Feed fingerprint: \`$feed_hash\`"
            echo "- Feed revisions:"
            printf '%s' "$feed_revisions" | sed 's/^/-   \`/; s/$/\`/'
            echo "- Immutable release tag: \`${RELEASE_PREFIX}-${source_commit:0:12}-${config_hash}-${feed_hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ needs.check-upstream.outputs.model_name_en }}
    if: ${{ needs.check-upstream.outputs.should_build == 'true' }}
    needs: check-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PONWRT_REPO: ${{ needs.check-upstream.outputs.ponwrt_repo }}
      PONWRT_REF: ${{ needs.check-upstream.outputs.ponwrt_ref }}
      PONWRT_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
      MODEL_ID: ${{ needs.check-upstream.outputs.model_id }}
      MODEL_NAME_EN: ${{ needs.check-upstream.outputs.model_name_en }}
      MODEL_NAME_ZH: ${{ needs.check-upstream.outputs.model_name_zh }}
      TARGET_CONFIG_SYMBOL: ${{ needs.check-upstream.outputs.target_config_symbol }}
      TARGET_SUBDIR: ${{ needs.check-upstream.outputs.target_subdir }}
      ARTIFACT_PREFIX: ${{ needs.check-upstream.outputs.artifact_prefix }}
      REQUIRED_PACKAGES: ${{ needs.check-upstream.outputs.required_packages }}
      EXCLUDE_KMODS: ${{ needs.check-upstream.outputs.exclude_kmods }}
      INCLUDE_ALL_KMODS: ${{ needs.check-upstream.outputs.include_all_kmods }}
      INCLUDE_ALL_PACKAGES: ${{ needs.check-upstream.outputs.include_all_packages }}
      USE_CCACHE: ${{ needs.check-upstream.outputs.use_ccache }}
      CONFIG_HASH: ${{ needs.check-upstream.outputs.config_hash }}
      FEED_HASH: ${{ needs.check-upstream.outputs.feed_hash }}
      FEED_REVISIONS: ${{ needs.check-upstream.outputs.feed_revisions }}
      CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache

    steps:
      - name: Maximize build space and add swap
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libfuse-dev libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-netifaces python3-pip python3-ply \
            python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Clone PonWrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf openwrt
            if git init openwrt \
              && git -C openwrt remote add origin "$PONWRT_REPO" \
              && git -C openwrt fetch --depth=1 origin "$PONWRT_REF" \
              && test "$(git -C openwrt rev-parse FETCH_HEAD)" = "$PONWRT_COMMIT" \
              && git -C openwrt checkout --detach "$PONWRT_COMMIT"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to clone PonWrt after $attempt attempts"
              exit 1
            fi
            echo "::warning::PonWrt clone failed (attempt $attempt/3); retrying"
            sleep $((attempt * 10))
          done
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"
          echo "PONWRT_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-dl-${{ hashFiles('configs/**', '.github/workflows/build-xg-040g-tf.yml') }}
          restore-keys: |
            ponwrt-dl-

      - name: Restore compiler cache
        if: env.USE_CCACHE == 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ponwrt-ccache-${{ env.PONWRT_COMMIT }}-${{ hashFiles('configs/**', '.github/workflows/build-xg-040g-tf.yml') }}
          restore-keys: |
            ponwrt-ccache-${{ env.PONWRT_COMMIT }}-
            ponwrt-ccache-

      - name: Restore host and toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain-*
          key: ponwrt-toolchain-${{ runner.os }}-${{ env.PONWRT_COMMIT }}-${{ hashFiles('configs/**', '.github/workflows/build-xg-040g-tf.yml') }}
          restore-keys: |
            ponwrt-toolchain-${{ runner.os }}-${{ env.PONWRT_COMMIT }}-

      - name: Install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Feed update failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::Feed update failed (attempt $attempt/3); retrying"
            sleep $((attempt * 10))
          done

          while IFS='=' read -r feed_name feed_commit; do
            [ -n "$feed_name" ] || continue
            feed_path="feeds/$feed_name"
            [ -d "$feed_path/.git" ] || {
              echo "::error::Expected git feed is missing: $feed_name"
              exit 1
            }
            for attempt in 1 2 3; do
              if git -C "$feed_path" fetch --depth=1 origin "$feed_commit" \
                && git -C "$feed_path" checkout --detach "$feed_commit"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to pin feed $feed_name to $feed_commit"
                exit 1
              fi
              echo "::warning::Feed pin failed for $feed_name (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
            done
            test "$(git -C "$feed_path" rev-parse HEAD)" = "$feed_commit" \
              || { echo "::error::Feed pin verification failed: $feed_name"; exit 1; }
          done <<< "$FEED_REVISIONS"

          for attempt in 1 2 3; do
            if ./scripts/feeds install -a; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Feed install failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::Feed install failed (attempt $attempt/3); retrying"
            sleep $((attempt * 10))
          done

          # miniupnpd 2.3.11 already contains the permission-parser rewrite
          # carried by this older feed patch.  ImmortalWrt's merge process can
          # leave the patch in place, which makes OpenWrt apply it twice.
          miniupnpd_dir="$OPENWRT_PATH/feeds/packages/net/miniupnpd"
          miniupnpd_makefile="$miniupnpd_dir/Makefile"
          miniupnpd_patch="$miniupnpd_dir/patches/020-descr-filter-fix.patch"
          if [ -f "$miniupnpd_makefile" ] &&
             [ -f "$miniupnpd_patch" ] &&
             grep -q '^PKG_VERSION:=2\.3\.11$' "$miniupnpd_makefile" &&
             grep -q 'Rewrite permission line parser' "$miniupnpd_patch"; then
            mv "$miniupnpd_patch" "$miniupnpd_patch.disabled"
            echo "::notice::Disabled stale miniupnpd parser patch for bundled 2.3.11 implementation"
          fi

      - name: Load APK signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > "$OPENWRT_PATH/private-key.pem"
            openssl ec -in "$OPENWRT_PATH/private-key.pem" -pubout -out "$OPENWRT_PATH/public-key.pem"
            echo "APK signing key loaded"
          else
            echo "No PONWRT_APK_PRIVATE_KEY secret configured; using the build system default"
          fi

      - name: Configure selected model
        env:
          EXTRA_PACKAGES: ${{ needs.check-upstream.outputs.extra_packages }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/configs/$MODEL_ID.config" "$OPENWRT_PATH/.config"

          # Keep package names data-only: no shell fragments are accepted here.
          set -f
          requested_packages=""
          for package in $EXTRA_PACKAGES; do
            if [[ "$package" =~ ^-([A-Za-z0-9_.-]+)$ ]]; then
              name="${package#-}"
              printf '# CONFIG_PACKAGE_%s is not set\n' "$name" >> "$OPENWRT_PATH/.config"
            elif [[ "$package" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              printf 'CONFIG_PACKAGE_%s=y\n' "$package" >> "$OPENWRT_PATH/.config"
              requested_packages="$requested_packages $package"
            else
              echo "::error::Invalid package name: $package"
              exit 1
            fi
          done
          set +f

          if [ "$INCLUDE_ALL_KMODS" = "true" ]; then
            printf 'CONFIG_ALL_KMODS=y\n' >> "$OPENWRT_PATH/.config"
          fi
          if [ "$USE_CCACHE" = "true" ]; then
            printf 'CONFIG_CCACHE=y\n' >> "$OPENWRT_PATH/.config"
          fi

          make -C "$OPENWRT_PATH" defconfig

          # CONFIG_ALL_KMODS expands to every package visible in the feeds,
          # including modules that are not compatible with this kernel tree.
          # Apply configured exclusions after defconfig so they remain explicit
          # n selections in the final build configuration.
          set -f
          for package in $EXCLUDE_KMODS; do
            [[ "$package" =~ ^kmod-[A-Za-z0-9_.-]+$ ]] || {
              echo "::error::Invalid EXCLUDE_KMODS entry: $package"
              exit 1
            }
            sed -i -E "/^CONFIG_PACKAGE_${package}(=| is not set)/d" \
              "$OPENWRT_PATH/.config"
            printf '# CONFIG_PACKAGE_%s is not set\n' "$package" \
              >> "$OPENWRT_PATH/.config"
          done
          set +f

          grep -q "^${TARGET_CONFIG_SYMBOL}=y$" \
            "$OPENWRT_PATH/.config" \
            || { echo "::error::Configured device profile was not selected: $TARGET_CONFIG_SYMBOL"; exit 1; }

          if [ "$INCLUDE_ALL_KMODS" = "true" ]; then
            grep -q '^CONFIG_ALL_KMODS=y$' "$OPENWRT_PATH/.config" \
              || { echo "::error::CONFIG_ALL_KMODS was dropped by defconfig"; exit 1; }
          fi

          set -f
          for package in $EXCLUDE_KMODS; do
            grep -q "^# CONFIG_PACKAGE_${package} is not set$" \
              "$OPENWRT_PATH/.config" \
              || { echo "::error::Excluded kmod was selected: $package"; exit 1; }
          done
          set +f

          for package in $REQUIRED_PACKAGES; do
            grep -q "^CONFIG_PACKAGE_${package}=y$" "$OPENWRT_PATH/.config" \
              || { echo "::error::Required PON package was dropped: $package"; exit 1; }
          done

          for package in $requested_packages; do
            grep -q "^CONFIG_PACKAGE_${package}=[ym]$" "$OPENWRT_PATH/.config" \
              || {
                echo "::error::Requested package was not selected after defconfig: $package"
                echo "::error::Check the package name and whether its feed supports this PonWrt revision."
                exit 1
              }
          done

          {
            echo "### Build configuration"
            echo "- Model / 型号: \`$MODEL_NAME_ZH / $MODEL_NAME_EN\`"
            echo "- Target profile: \`$TARGET_CONFIG_SYMBOL\`"
            echo "- PonWrt commit: \`$PONWRT_COMMIT\`"
            echo "- Required PON packages: verified"
            echo "- Package manager: \`apk\`"
            echo "- All target-compatible kmods: \`$INCLUDE_ALL_KMODS\`"
            echo "- Excluded unbuildable kmods: \`${EXCLUDE_KMODS:-none}\`"
            if [ -n "$requested_packages" ]; then
              echo "- Extra packages: verified after \`make defconfig\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::make download failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::make download failed (attempt $attempt/3); removing incomplete files"
            find dl -size -1024c -type f -delete
            sleep $((attempt * 10))
          done
          find dl -size -1024c -type f -delete

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          if make -j"$(nproc)" world 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; then
            exit 0
          fi
          echo "::warning::Parallel build failed; retrying with a single-threaded build"
          if make -j1 world 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"; then
            exit 0
          fi
          echo "::warning::Single-threaded build failed; retrying with verbose output"
          make -j1 V=s world 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          out="$OPENWRT_PATH/bin/targets/$TARGET_SUBDIR"
          test -d "$out"

          {
            echo "model_id=$MODEL_ID"
            echo "model_name_en=$MODEL_NAME_EN"
            echo "model_name_zh=$MODEL_NAME_ZH"
            echo "target_profile=$TARGET_CONFIG_SYMBOL"
            echo "ponwrt_repo=$PONWRT_REPO"
            echo "ponwrt_ref=$PONWRT_REF"
            echo "ponwrt_commit=$PONWRT_COMMIT"
            echo "config_hash=$CONFIG_HASH"
            echo "feed_hash=$FEED_HASH"
            echo "exclude_kmods=${EXCLUDE_KMODS:-}"
            echo "build_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "PON data is device-unique and is intentionally not embedded."
            echo "Restore the original bosa and ri backups after flashing."
            echo
            echo "Feed commits:"
            while IFS='=' read -r feed_name feed_commit; do
              [ -n "$feed_name" ] || continue
              printf '%s=%s\n' "$feed_name" \
                "$(git -C "$OPENWRT_PATH/feeds/$feed_name" rev-parse HEAD)"
            done <<< "$FEED_REVISIONS"
          } > "$out/build-manifest.txt"

          cp "$OPENWRT_PATH/.config" "$out/build.config"
          cp "$GITHUB_WORKSPACE/configs/$MODEL_ID.config" "$out/base.config"

          package_count=$(find "$OPENWRT_PATH/bin/packages" -type f \
            \( -name '*.apk' -o -name '*.ipk' \) | wc -l | tr -d ' ')
          [ "$package_count" -gt 0 ] \
            || { echo "::error::No compiled package files were found"; exit 1; }

          if [ "$INCLUDE_ALL_PACKAGES" = "true" ]; then
            package_bundle="$OPENWRT_PATH/package-bundle"
            package_root="$package_bundle/packages"
            rm -rf "$package_bundle"
            mkdir -p "$package_root"

            while IFS= read -r -d '' package_file; do
              relative="${package_file#$OPENWRT_PATH/bin/packages/}"
              destination="$package_root/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$package_file" "$destination"
            done < <(
              find "$OPENWRT_PATH/bin/packages" -type f -print0
            )

            cp "$OPENWRT_PATH/.config" "$package_bundle/build.config"
            cp "$out/build-manifest.txt" "$package_bundle/build-manifest.txt"
            if [ -f "$OPENWRT_PATH/public-key.pem" ]; then
              cp "$OPENWRT_PATH/public-key.pem" "$package_bundle/public-key.pem"
            fi
            {
              echo "model_id=$MODEL_ID"
              echo "target_profile=$TARGET_CONFIG_SYMBOL"
              echo "ponwrt_commit=$PONWRT_COMMIT"
              echo "config_hash=$CONFIG_HASH"
              echo "feed_hash=$FEED_HASH"
              echo "package_count=$package_count"
              echo "package_manager=apk"
              echo
              echo "Install packages only on a matching PonWrt release."
            } > "$package_bundle/package-manifest.txt"
            (
              cd "$package_bundle"
              find packages -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$package_bundle/SHA256SUMS"

            tar -czf "$out/${ARTIFACT_PREFIX}-packages.tar.gz" \
              -C "$package_bundle" .
            rm -rf "$package_bundle"

            {
              echo "- \`${ARTIFACT_PREFIX}-packages.tar.gz\` — all compiled APK/IPK packages"
              echo "- package count: \`$package_count\`"
              echo "- Install only on the matching PonWrt release"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$INCLUDE_ALL_KMODS" = "true" ]; then
            bundle="$OPENWRT_PATH/kmod-bundle"
            package_root="$bundle/packages"
            rm -rf "$bundle"
            mkdir -p "$package_root"

            # Preserve the bin/ tree layout so duplicate package names from
            # different feeds cannot overwrite one another.
            while IFS= read -r -d '' package_file; do
              relative="${package_file#$OPENWRT_PATH/bin/}"
              destination="$bundle/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$package_file" "$destination"
            done < <(
              find "$OPENWRT_PATH/bin" -type f \
                \( -name 'kmod-*.apk' -o -name 'kernel*.apk' \
                   -o -name 'kmod-*.ipk' -o -name 'kernel*.ipk' \
                   -o -name '*-firmware*.apk' -o -name '*-firmware*.ipk' \) \
                -print0
            )

            # The bundle mirrors the complete bin/ tree.  Target-specific
            # packages live below targets/, while feed packages live below
            # packages/, so counting only "$package_root" can report zero
            # even after the copy above succeeded.
            kmod_count=$(find "$bundle" -type f \
              \( -name 'kmod-*.apk' -o -name 'kmod-*.ipk' \) \
              | wc -l | tr -d ' ')
            [ "$kmod_count" -gt 0 ] \
              || {
                echo "::error::CONFIG_ALL_KMODS produced no kmod packages"
                echo "Collected package paths:"
                find "$bundle" -type f \
                  \( -name 'kmod-*.apk' -o -name 'kmod-*.ipk' \
                     -o -name 'kernel*.apk' -o -name 'kernel*.ipk' \
                     -o -name '*-firmware*.apk' -o -name '*-firmware*.ipk' \) \
                  -print | sort
                exit 1
              }

            echo "Collected kmod/kernel/firmware packages:"
            find "$bundle" -type f \
              \( -name 'kmod-*.apk' -o -name 'kmod-*.ipk' \
                 -o -name 'kernel*.apk' -o -name 'kernel*.ipk' \
                 -o -name '*-firmware*.apk' -o -name '*-firmware*.ipk' \) \
              -print | sort

            cp "$OPENWRT_PATH/.config" "$bundle/build.config"
            if [ -f "$OPENWRT_PATH/public-key.pem" ]; then
              cp "$OPENWRT_PATH/public-key.pem" "$bundle/public-key.pem"
            fi
            {
              echo "model_id=$MODEL_ID"
              echo "target_profile=$TARGET_CONFIG_SYMBOL"
              echo "ponwrt_commit=$PONWRT_COMMIT"
              echo "config_hash=$CONFIG_HASH"
              echo "feed_hash=$FEED_HASH"
              echo "exclude_kmods=${EXCLUDE_KMODS:-}"
              echo "kmod_count=$kmod_count"
              echo "package_manager=apk"
              echo
              echo "Install only on the matching $MODEL_NAME_EN PonWrt release."
              echo "The bundle is not a generic OpenWrt kmod repository."
              echo "If using apk, install local packages from the packages/ tree."
            } > "$bundle/kmod-manifest.txt"

            (
              cd "$bundle"
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 sha256sum
            ) > "$bundle/SHA256SUMS"

            python3 - "$bundle" "$out/${ARTIFACT_PREFIX}-kmods.zip" <<'PY'
          import os
          import sys
          import zipfile

          root, output = sys.argv[1:3]
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for directory, _, files in os.walk(root):
                  for name in sorted(files):
                      path = os.path.join(directory, name)
                      archive.write(path, os.path.relpath(path, root))
          PY

            cp "$bundle/SHA256SUMS" "$out/${ARTIFACT_PREFIX}-kmods.SHA256SUMS"
            rm -rf "$bundle"

            {
              echo "- \`${ARTIFACT_PREFIX}-kmods.zip\` — target-compatible kmod/kernel/firmware packages"
              echo "- kmod count: \`$kmod_count\`"
              echo "- Only install packages matching this exact firmware release"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Firmware artifacts"
            echo "PonWrt commit: \`$PONWRT_COMMIT\`"
            echo "Feed fingerprint: \`$FEED_HASH\`"
            echo "Compiled package count: \`$package_count\`"
            echo "The artifact contains the firmware image, recovery image (if generated), config, manifest, and ${ARTIFACT_PREFIX}.SHA256SUMS."
            echo
            echo "**Important:** \`bosa\` and \`ri\` are per-device data and are not included in this build."
            if [ "$INCLUDE_ALL_KMODS" = "true" ]; then
              echo "**kmod bundle:** \`${ARTIFACT_PREFIX}-kmods.zip\` contains only packages built for this exact kernel/configuration."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          (
            cd "$out"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$out/${ARTIFACT_PREFIX}.SHA256SUMS"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-upstream.outputs.artifact_prefix }}-ponwrt-${{ github.run_number }}
          path: |
            openwrt/bin/targets/${{ needs.check-upstream.outputs.target_subdir }}
            build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: >-
      ${{
        needs.check-upstream.outputs.should_build == 'true' &&
        needs.check-upstream.outputs.publish_release == 'true'
      }}
    needs:
      - check-upstream
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check-upstream.outputs.artifact_prefix }}-ponwrt-${{ github.run_number }}
          path: release-assets

      - name: Stage release files
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/release-assets/openwrt/bin/targets/${{ needs.check-upstream.outputs.target_subdir }}"
          release_dir="$GITHUB_WORKSPACE/release-files"
          test -d "$source_dir"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          # The target directory also contains package indexes and feed
          # subdirectories.  Release attachments must be regular files only.
          while IFS= read -r -d '' artifact; do
            cp "$artifact" "$release_dir/"
          done < <(find "$source_dir" -maxdepth 1 -type f -print0 | sort -z)

          declare -A seen_names=()
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            normalized="${name,,}"
            if [ -n "${seen_names[$normalized]:-}" ]; then
              echo "::error::Release assets collide case-insensitively: ${seen_names[$normalized]} and $name"
              exit 1
            fi
            seen_names["$normalized"]="$name"
          done < <(find "$release_dir" -maxdepth 1 -type f -print0)

          find "$release_dir" -maxdepth 1 -type f -print
          test -n "$(find "$release_dir" -maxdepth 1 -type f -print -quit)"

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
        run: |
          set -euo pipefail
          asset_names="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"
          if [ -z "$asset_names" ]; then
            echo "No existing assets for $RELEASE_TAG"
            exit 0
          fi

          while IFS= read -r asset_name; do
            [ -n "$asset_name" ] || continue
            echo "Removing stale release asset: $asset_name"
            gh release delete-asset "$RELEASE_TAG" "$asset_name" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done <<< "$asset_names"

      - name: Write bilingual release notes
        env:
          MODEL_NAME_EN: ${{ needs.check-upstream.outputs.model_name_en }}
          MODEL_NAME_ZH: ${{ needs.check-upstream.outputs.model_name_zh }}
          MODEL_ID: ${{ needs.check-upstream.outputs.model_id }}
          TARGET_PROFILE: ${{ needs.check-upstream.outputs.target_config_symbol }}
          PONWRT_REF: ${{ needs.check-upstream.outputs.ponwrt_ref }}
          SOURCE_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
          CONFIG_HASH: ${{ needs.check-upstream.outputs.config_hash }}
          FEED_HASH: ${{ needs.check-upstream.outputs.feed_hash }}
          FEED_REVISIONS: ${{ needs.check-upstream.outputs.feed_revisions }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
          BUILD_COMMIT: ${{ github.sha }}
          INCLUDE_ALL_KMODS: ${{ needs.check-upstream.outputs.include_all_kmods }}
          INCLUDE_ALL_PACKAGES: ${{ needs.check-upstream.outputs.include_all_packages }}
          EXCLUDE_KMODS: ${{ needs.check-upstream.outputs.exclude_kmods }}
          RELEASE_TARGET_COMMIT: ${{ needs.check-upstream.outputs.release_target_commit }}
          RELEASE_TARGET_REASON: ${{ needs.check-upstream.outputs.release_target_reason }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # ${MODEL_NAME_ZH} / ${MODEL_NAME_EN} PonWrt

          ## 中文

          适用于 **${MODEL_NAME_ZH}** 的 PonWrt 固件构建。

          ### 构建信息

          - 型号标识：\`${MODEL_ID}\`
          - OpenWrt 目标配置：\`${TARGET_PROFILE}\`
          - PonWrt 分支或标签：\`${PONWRT_REF}\`
          - PonWrt 提交：\`${SOURCE_COMMIT}\`
          - 配置指纹：\`${CONFIG_HASH}\`
          - feeds 指纹：\`${FEED_HASH}\`
          - 构建仓库提交：\`${BUILD_COMMIT}\`
          - Release tag 目标提交：\`${RELEASE_TARGET_COMMIT}\`（${RELEASE_TARGET_REASON}）
          - Release 标签：\`${RELEASE_TAG}\`
          - 全量兼容 kmod：\`${INCLUDE_ALL_KMODS}\`
          - 全量软件包归档：\`${INCLUDE_ALL_PACKAGES}\`
          - 排除的 kmod：\`${EXCLUDE_KMODS:-无}\`

          ### feeds 提交

          \`\`\`text
          ${FEED_REVISIONS}
          \`\`\`

          ### 发布附件

          Release 中的固件、校验和、构建配置、构建清单以及可选的软件包/kmod 归档均来自同一次构建。

          ### 使用注意

          只安装与本次固件完全匹配的 kmod 和软件包。刷机前务必备份并在刷机后恢复本机的 PON 身份与校准数据（包括 \`bosa\`、\`ri\` 和原厂 \`romfile\`，具体以设备实际分区为准）。本 Release 不包含任何设备私有身份数据。

          ## English

          PonWrt firmware build for **${MODEL_NAME_EN}**.

          ### Build information

          - Model ID: \`${MODEL_ID}\`
          - OpenWrt target profile: \`${TARGET_PROFILE}\`
          - PonWrt branch or tag: \`${PONWRT_REF}\`
          - PonWrt commit: \`${SOURCE_COMMIT}\`
          - Configuration fingerprint: \`${CONFIG_HASH}\`
          - Feed fingerprint: \`${FEED_HASH}\`
          - Build repository commit: \`${BUILD_COMMIT}\`
          - Release tag target commit: \`${RELEASE_TARGET_COMMIT}\` (${RELEASE_TARGET_REASON})
          - Release tag: \`${RELEASE_TAG}\`
          - All compatible kmods: \`${INCLUDE_ALL_KMODS}\`
          - Full package archive: \`${INCLUDE_ALL_PACKAGES}\`
          - Excluded kmods: \`${EXCLUDE_KMODS:-none}\`

          ### Feed commits

          \`\`\`text
          ${FEED_REVISIONS}
          \`\`\`

          ### Release assets

          Firmware, checksums, build configuration, build manifest, and optional package/kmod archives are all generated by this exact build.

          ### Important

          Install kmods and packages only when they match this exact firmware build. Back up the device before flashing and restore its own PON identity and calibration data afterwards (including \`bosa\`, \`ri\`, and the stock \`romfile\`, according to the actual device partitions). No device-private identity data is included in this release.
          EOF
          {
            echo
            echo "### 构建清单 / Build manifest"
            echo
            echo '```text'
            cat release-files/build-manifest.txt
            echo '```'
            echo
            echo "### 附件列表 / Asset list"
            find release-files -maxdepth 1 -type f -printf '%f\n' \
              | sort \
              | sed 's/^/- `&`/'
          } >> release-notes.md

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-upstream.outputs.release_tag }}
          name: ${{ needs.check-upstream.outputs.model_name_zh }} / ${{ needs.check-upstream.outputs.model_name_en }} PonWrt ${{ needs.check-upstream.outputs.source_commit_short }} (${{ needs.check-upstream.outputs.config_hash }}-${{ needs.check-upstream.outputs.feed_hash }})
          commit: ${{ needs.check-upstream.outputs.release_target_commit }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: release-files/*
          artifactErrorsFailBuild: true
          # The tag contains the full source/config/feed fingerprint, so an
          # update can only repair this exact immutable build record.
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true
          bodyFile: release-notes.md

  record-success:
    name: Record successful upstream commit
    if: >-
      ${{
        always() &&
        needs.check-upstream.outputs.should_build == 'true' &&
        needs.build.result == 'success' &&
        (needs.release.result == 'success' || needs.release.result == 'skipped')
      }}
    needs:
      - check-upstream
      - build
      - release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Save source commit state
        env:
          MODEL_ID: ${{ needs.check-upstream.outputs.model_id }}
          SOURCE_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
          FEED_HASH: ${{ needs.check-upstream.outputs.feed_hash }}
          CONFIG_HASH: ${{ needs.check-upstream.outputs.config_hash }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci
          cat > "ci/last-built-ponwrt-state-$MODEL_ID.env" <<EOF
          model_id=$MODEL_ID
          source_commit=$SOURCE_COMMIT
          feed_hash=$FEED_HASH
          config_hash=$CONFIG_HASH
          EOF
          rm -f ci/last-built-ponwrt-commit.txt
          git add -A ci
          if git diff --cached --quiet; then
            echo "Upstream commit state is already recorded"
            exit 0
          fi
          git commit -m "ci: record successful PonWrt build $SOURCE_COMMIT"
          git push origin HEAD:main

  cleanup-cache:
    name: Clean old build caches
    if: >-
      ${{
        always() &&
        needs.check-upstream.outputs.should_build == 'true' &&
        needs.build.result == 'success' &&
        needs.record-success.result == 'success'
      }}
    needs:
      - check-upstream
      - build
      - release
      - record-success
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for prefix in ponwrt-dl- ponwrt-ccache- ponwrt-toolchain-; do
            cache_ids="$(
              gh cache list \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$GITHUB_REF" \
                --limit 10000 \
                --sort created_at \
                --order desc \
                --json id,key \
                | jq -r --arg prefix "$prefix" \
                    '[.[] | select(.key | startswith($prefix))] | .[2:] | .[].id'
            )"
            while IFS= read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY" --confirm \
                || echo "::warning::Unable to delete cache $cache_id"
            done <<< "$cache_ids"
          done
